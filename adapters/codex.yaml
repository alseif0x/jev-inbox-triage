# Codex host — classifier is always Jev; map tiers to model + effort
classifier:
  provider: typesafe  # preferred; see typesafe-native.yaml
  model: jev-latest
  # fallback: openrouter / typesafe/jev-1.13
routing:
  fast:
    model: gpt-5.6
    variant: luna
    effort: high
  default:
    model: gpt-5.6
    variant: luna
    effort: max
  strong:
    model: astra
    effort: low
