# Claude host — classifier is always Jev; map tiers to model + effort
classifier:
  provider: typesafe  # preferred; see typesafe-native.yaml
  model: jev-latest
  # fallback: openrouter / typesafe/jev-1.13
routing:
  fast:
    model: claude-opus
    effort: low
  default:
    model: claude-opus
    effort: high
  strong:
    model: claude-fable
    effort: medium
